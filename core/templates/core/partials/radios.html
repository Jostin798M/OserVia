{% load ui %}<fieldset class="field{% if cls %} {{ cls }}{% endif %}" {% if attrs %}{{ attrs }}{% endif %}>
  <legend class="label">{% firstof label field.label %}{% if field.field.required %} <span class="req-mark" aria-hidden="true">*</span>{% endif %}</legend>
  <div class="pills">
    {% for r in field %}<label class="pill">{{ r.tag }}<span>{{ r.choice_label }}</span></label>{% endfor %}
  </div>
  {% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="error" role="alert">{% icon 'alert' 14 %}{{ e }}</p>{% endfor %}
</fieldset>

{% load ui %}<div class="field{% if cls %} {{ cls }}{% endif %}">
  <label class="label" for="{{ field.id_for_label }}">{% firstof label field.label %}{% if field.field.required %} <span class="req-mark" aria-hidden="true">*</span>{% endif %}</label>
  <div class="control{% if icon %} has-icon{% endif %}">
    {% if icon %}{% icon icon 18 'control-icon' %}{% endif %}
    {{ field }}
  </div>
  {% if field.help_text %}<p class="hint" id="{{ field.auto_id }}_help">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="error" role="alert">{% icon 'alert' 14 %}{{ e }}</p>{% endfor %}
</div>

{% load static %}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6fb">
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="icon" href="{% static 'core/img/favicon.png' %}" type="image/png" media="(prefers-color-scheme: light)">
<link rel="icon" href="{% static 'core/img/favicon-oscuro.png' %}" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{% static 'core/img/favicon.png' %}" type="image/png">
<link rel="apple-touch-icon" href="{% static 'core/img/apple-touch-icon.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="{% static 'core/css/app.css' %}">
